<!DOCTYPE html>
<html lang="en">

<body>
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            font-size: 16px;
        }
        h3 {
            font-size: 22px;
            margin-bottom: 15px;
            margin-top: 5px;
        }
        table {
            border-collapse: collapse;
            border: 1px solid black;
        }
        td {
            padding: 2px 0;
            vertical-align: top;
        }
        td:first-child {
            padding-right: 5px;
        }
        textarea {
            font-family: monospace;
        }
        .bio-label {
            vertical-align: bottom;
            padding-bottom: 2px;
        }
        button {
            margin-top: 5px;
            margin-right: 35px
        }
    </style>
</head>
<body>
    <h1>ĐĂNG KÝ</h1>
    <form>
        <table>
            <tr>
                <td>Enter Name :</td>
                <td><input type="text" ></td>
            </tr>
            <tr>
                <td>Enter Password :</td>
                <td><input type="text" ></td>
            </tr>
            <tr>
                <td>Enter Email :</td>
                <td><input type="text" ></td>
            </tr>
            <tr>
                <td>Enter Gender:</td>
                <td>
                    <input type="radio" name="gioitinh" value="nam"> Nam 
                    <input type="radio" name="gioitinh" value="nu"> Nữ 
                </td>
            </tr>
                <td>Select Country</td>
                <td>
                    <select>
                        <option>India</option>
                        <option>VietNam</option>
                        <option>USA</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <button type="submit">Register</button>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
</body>
</html>
